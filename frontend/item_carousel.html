<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {box-sizing:border-box} body {margin:0;font-family:system-ui,sans-serif;color:#252321;background:#fffaf3}
.carousel {display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:8px;align-items:center}
.track {display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:24px}
.track::-webkit-scrollbar {display:none}
.slide {flex:0 0 100%;min-width:0;scroll-snap-align:center;border:1px solid #dfd8ce;border-radius:24px;padding:22px;background:#fff;min-height:360px}
h2 {font-size:clamp(1.1rem,4vw,1.5rem);text-align:center;margin:5px 0;overflow-wrap:anywhere}
.emoji {text-align:center;font-size:1.8rem}.restaurant {text-align:center;color:#6d6862;margin:6px 0 22px}
.price-row {display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0;font-size:1rem}
.price-row div {text-align:right} strong {font-size:1.55rem} small {display:block;font-size:.75rem;margin-top:3px}
.higher {color:#b4233c}.lower {color:#197047}.muted,.note {color:#6d6862}
.muted {font-size:.85rem}.note {font-size:.75rem;line-height:1.4;margin:20px 0 0}
button {cursor:pointer;background:transparent;color:#8f2439;border:1px solid #dfd8ce}
.arrow {border-radius:50%;width:38px;height:38px;font-size:1.4rem}
button:focus-visible,.track:focus-visible {outline:3px solid #287c58;outline-offset:2px}
.dots {display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:16px 8px 5px}
.dot {border-radius:50%;width:12px;height:12px;padding:0}.dot[aria-current=true] {background:#b8324b;border-color:#b8324b}
.status {text-align:center;font-size:.75rem;color:#6d6862;margin:8px 0}
@media(max-width:420px) {.carousel {grid-template-columns:30px minmax(0,1fr) 30px;gap:4px}.arrow{width:28px;height:34px}.slide{padding:16px}strong{font-size:1.25rem}}
</style></head>
<body>
<section aria-label="Featured menu items" aria-roledescription="carousel">
<div class="carousel">
<button class="arrow" id="previous" aria-label="Previous item">←</button>
<div class="track" tabindex="0" aria-label="Swipe or use arrow keys to browse items"><!--CARDS--></div>
<button class="arrow" id="next" aria-label="Next item">→</button>
</div>
<div class="dots"><!--DOTS--></div><p class="status" aria-live="polite"></p>
</section>
<script>
const track = document.querySelector('.track');
const slides = [...document.querySelectorAll('.slide')];
const dots = [...document.querySelectorAll('.dot')];
let current = 0;
function go(index) {
  const target = (index + slides.length) % slides.length;
  track.scrollTo({left:target * track.clientWidth, behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'});
}
function update() {
  current = Math.round(track.scrollLeft / track.clientWidth);
  dots.forEach((dot,i) => dot.setAttribute('aria-current',String(i === current)));
  slides.forEach((slide,i) => slide.setAttribute('aria-hidden',String(i !== current)));
  document.querySelector('.status').textContent = `${current+1} of ${slides.length} · Swipe to explore`;
}
document.querySelector('#previous').onclick = () => go(current-1);
document.querySelector('#next').onclick = () => go(current+1);
dots.forEach((dot,i) => dot.onclick = () => go(i));
track.addEventListener('scroll',update,{passive:true});
track.addEventListener('keydown',event => {
  if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
    event.preventDefault();go(current + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
new ResizeObserver(() => {track.scrollTo({left:current * track.clientWidth,behavior:'instant'});}).observe(track);
update();
</script></body></html>
